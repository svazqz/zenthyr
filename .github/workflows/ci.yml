name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "Clojure library tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 22
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Build the test image"
        run: "docker build -f test/Dockerfile -t zenthyr-tests ."
      - name: "Run Leiningen tests in a virtual display"
        run: "docker run --rm --network none zenthyr-tests"
